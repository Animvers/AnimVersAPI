security:
    # ─── Hashage des mots de passe ───────────────────────────────────────────────
    # On utilise l'algorithme "auto" (bcrypt/argon2i selon l'environnement)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # ─── Provider : charge l'utilisateur depuis la base de données ───────────────
    # LexikJWT utilise ce provider pour retrouver le User à partir du JWT
    providers:
        app_user_provider:
            entity:
                # L'entité à utiliser comme utilisateur
                class: App\Entity\User
                # La propriété qui sert d'identifiant unique (getUserIdentifier() retourne l'email)
                property: email

    # ─── Firewalls ───────────────────────────────────────────────────────────────
    firewalls:
        # Zone dev : pas de sécurité sur le profiler et les assets
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Zone principale : toutes les autres routes passent par ici
        main:
            lazy: true
            provider: app_user_provider

            # On active le guard JWT de LexikJWT
            # Il va lire le header "Authorization: Bearer <token>" automatiquement
            jwt: ~

            # Pas de session côté serveur : l'API est stateless (JWT s'en charge)
            stateless: true

    # ─── Contrôle d'accès ────────────────────────────────────────────────────────
    access_control:
        # Routes publiques : inscription et connexion ne nécessitent pas de JWT
        - { path: ^/auth/login,    roles: PUBLIC_ACCESS }
        - { path: ^/auth/register, roles: PUBLIC_ACCESS }
        # Toutes les autres routes nécessitent d'être authentifié (JWT valide)
        - { path: ^/,              roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4        # Valeur minimale bcrypt (tests plus rapides)
                time_cost: 3   # Valeur minimale argon
                memory_cost: 10 # Valeur minimale argon
